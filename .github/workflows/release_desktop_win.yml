name: Desktop MSI / EXE artifact CI
on:
  push:
    tags:
      - 'v*' # This workflow will ONLY run when you push a tag starting with 'v', like v1.0.0

jobs:
  build-msi:
    runs-on: windows-latest

    permissions:
      contents: write

    # fixmw: try java 23
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

        # Build the MSI file using the custom Gradle task
      - name: Package MSI
        run: ./gradlew packageReleaseMsi

        # Upload MSI as an artifact
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # This automatically uses the tag you just pushed (e.g., v1.0.0)
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            composeApp/build/compose/binaries/main-release/msi/*.msi

