name: Desktop DEB and RPM and Arch release

on:
  push:
    tags:
      - 'v*' # This workflow will ONLY run when you push a tag starting with 'v', like v1.0.0

jobs:
  build-linux-packages:
    runs-on: ubuntu-latest

    # REQUIRED: Gives the action permission to create a release in your repo
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21' 
          distribution: 'temurin'
          cache: gradle

      # Install the tools for BOTH formats
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm ruby ruby-dev rubygems build-essential libarchive-tools
          sudo gem install --no-document fpm

      # Build the .deb file
      - name: Build DEB
        run: ./gradlew packageReleaseDeb

      # Build the .rpm file
      - name: Build RPM
        run: ./gradlew packageReleaseRpm

      # Build the Arch Linux package using fpm to convert the DEB
      # Build the Arch Linux package using fpm to convert the DEB
      - name: Build Arch (Pacman)
        run: |
          mkdir -p composeApp/build/compose/binaries/main-release/arch
          
          # -s deb: Source is DEB
          # -t pacman: Target is Arch
          # --no-depends: Strip the Debian-specific dependency names
          # -d: Inject the correct Arch Linux package names
          fpm -s deb -t pacman \
            --no-depends \
            -d "alsa-lib" \
            -d "brotli" \
            -d "libbsd" \
            -d "bzip2" \
            -d "glibc" \
            -d "expat" \
            -d "libffi" \
            -d "fontconfig" \
            -d "freetype2" \
            -d "gcc-libs" \
            -d "libglvnd" \
            -d "libmd" \
            -d "libpng" \
            -d "wayland" \
            -d "libx11" \
            -d "libxau" \
            -d "libxcb" \
            -d "libxdmcp" \
            -d "libxext" \
            -d "libxi" \
            -d "libxrender" \
            -d "libxtst" \
            -d "xdg-utils" \
            -d "zlib" \
            -p composeApp/build/compose/binaries/main-release/arch/ \
            composeApp/build/compose/binaries/main-release/deb/*.deb

      # Upload both as artifacts
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # This automatically uses the tag you just pushed (e.g., v1.0.0)
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            composeApp/build/compose/binaries/main-release/deb/*.deb
            composeApp/build/compose/binaries/main-release/rpm/*.rpm
            composeApp/build/compose/binaries/main-release/arch/*.pkg.tar.*
